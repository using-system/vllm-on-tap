name: gemma4-e2b-qat
description: Gemma 4 E2B instruction-tuned (2.3B effective parameters), Google's QAT 4-bit weights (compressed-tensors, w4a16); MLX 4-bit on local-vllm-metal
model: google/gemma-4-E2B-it-qat-w4a16-ct
served_model_name: gemma4-e2b
gpu_memory_gb: 16
vllm_args:
  --max-model-len: 16384
  --gpu-memory-utilization: 0.90
env: []
stacks:
  local-vllm-metal:
    model: mlx-community/gemma-4-e2b-it-4bit
    vllm_args:
      --language-model-only: true
